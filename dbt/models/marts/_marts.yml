version: 2

models:
  - name: dim_client
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_produit
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fact_commandes
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_client')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_produit')
                field: product_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_expeditions
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_client')
                field: customer_id
      - name: seller_id
        data_tests:
          - not_null
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivered_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: estimated_delivery_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_commandes_en_cours
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_client')
                field: customer_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
